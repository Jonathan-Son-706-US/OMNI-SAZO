services:
  sqlserver:
    ports:
      - "1434:1433"

  backend:
    image: omni-backend-dev
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    image: omni-frontend-dev
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host