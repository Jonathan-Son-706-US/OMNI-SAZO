name: Build y push a Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile.prod
          push: true
          tags: |
            jonasgoat/omni-backend:latest
            jonasgoat/omni-backend:${{ github.sha }}

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/dockerfile.prod
          push: true
          tags: |
            jonasgoat/omni-frontend:latest
            jonasgoat/omni-frontend:${{ github.sha }}
      
      - name: Desplegar en Dokploy
        run: |
          curl -fsS -X POST "${{ secrets.DOKPLOY_URL }}/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -d '{"composeId": "${{ secrets.DOKPLOY_COMPOSE_ID }}"}'