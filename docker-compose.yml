name: omni-sazo2

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: omni_sql_server
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF EXISTS (SELECT 1 FROM sys.databases WHERE state <> 0) RAISERROR('no listo',16,1)" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: omni_db_init
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db/scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]

  backend:
    image: jonasgoat/omni-backend:latest
    container_name: omni_backend
    restart: always
    environment:
      PORT: 5000
      DB_SERVER: sqlserver
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: OMNISAZO
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    image: jonasgoat/omni-frontend:latest
    container_name: omni_frontend
    restart: always
    depends_on:
      - backend
    #ports:
    #  - "8080:80"

volumes:
  mssql_data: